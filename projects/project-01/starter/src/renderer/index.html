<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Document Q&A</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="document-list">
      <h2>Documents</h2>
      <ul id="doc-list"></ul>
    </aside>

    <main class="content">
      <section class="viewer">
        <h2 id="doc-title">Select a document</h2>
        <pre id="doc-body"></pre>
      </section>

      <section class="qa-panel">
        <h2>Ask a question</h2>
        <form id="qa-form">
          <input id="qa-input" type="text" placeholder="Ask about your documents..." autocomplete="off" />
          <button type="submit">Ask</button>
        </form>
        <div id="qa-answers"></div>
      </section>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
